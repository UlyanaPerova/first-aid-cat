name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: new advisories for dependencies
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests, translation, Windows cross-check)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('engine/Cargo.lock', 'engine/build.rs', 'engine/.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: Toolchain
        run: |
          retry(){ for i in 1 2 3; do timeout 300 "$@" && return 0; echo "retry $i: $*"; sleep 10; done; return 1; }
          retry rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          retry rustup target add x86_64-pc-windows-gnu
          retry sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          retry sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends gcc-mingw-w64-x86-64
      - name: Format
        run: cargo fmt --check
      - name: Clippy (Linux)
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Clippy (Windows)
        run: cargo clippy --release --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Every user-visible string is translated
        run: python3 ../tools/i18n.py check
      - name: Third-party notices match Cargo.lock
        run: python3 ../tools/notices.py --check
      - name: Builds with the oldest supported Rust (rust-version)
        run: |
          retry(){ for i in 1 2 3; do timeout 300 "$@" && return 0; echo "retry $i: $*"; sleep 10; done; return 1; }
          retry rustup toolchain install 1.89 --profile minimal --no-self-update
          cargo +1.89 check --release --locked
      - name: Builds with the custom/ example (CUSTOM.md)
        run: |
          cp -r ../examples/custom ../custom
          cargo clippy --release --locked -- -D warnings
          cargo clippy --release --locked --target x86_64-pc-windows-gnu -- -D warnings
          cargo test --release --locked custom::
          rm -rf ../custom

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('engine/Cargo.lock', 'engine/build.rs', 'engine/.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Tests
        run: cargo test --release --locked

  macos:
    name: macOS tests and app build
    runs-on: macos-15   # Xcode 16 / macOS 15 SDK: the widget uses macOS 15 APIs behind availability checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('engine/Cargo.lock', 'engine/build.rs', 'engine/.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Clippy (macOS)
        working-directory: engine
        run: rustup component add clippy && cargo clippy --release --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: engine
        run: cargo test --release --locked
      - name: App + WidgetKit widget
        run: macos/build_app.sh

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('engine/Cargo.lock', 'engine/build.rs', 'engine/.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: cargo audit
        working-directory: engine
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --deny warnings
