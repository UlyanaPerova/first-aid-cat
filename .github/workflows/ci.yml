name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: new advisories for dependencies
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests, translation, Windows cross-check)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - name: Format
        run: cargo fmt --check
      - name: Clippy (Linux)
        run: cargo clippy --release --locked -- -D warnings
      - name: Clippy (Windows)
        run: cargo clippy --release --locked --target x86_64-pc-windows-gnu -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Every user-visible string is translated
        run: python3 ../tools/i18n.py check

  windows:
    name: Windows tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Tests
        run: cargo test --release --locked

  macos:
    name: macOS tests and app build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Tests
        working-directory: engine
        run: cargo test --release --locked
      - name: App + WidgetKit widget
        run: macos/build_app.sh

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        working-directory: engine
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --deny warnings
