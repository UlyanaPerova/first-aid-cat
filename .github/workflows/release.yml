name: Release

# A tag like v0.9.1 builds all three systems and publishes a GitHub release with the archives and checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-windows:
    name: Linux and Windows builds
    # the oldest supported Ubuntu: the binary then needs only glibc 2.35
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends gcc-mingw-w64-x86-64
      - name: Version matches the tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Cargo.toml version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Test
        working-directory: engine
        run: cargo test --release --locked
      - name: Build
        working-directory: engine
        run: |
          cargo build --release --locked
          cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Package
        run: |
          packaging/dist.sh linux
          packaging/dist.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  macos:
    name: macOS build (Apple silicon)
    runs-on: macos-15   # Xcode 16 / macOS 15 SDK: the widget uses macOS 15 APIs behind availability checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Test
        working-directory: engine
        run: cargo test --release --locked
      - name: Build app
        run: macos/build_app.sh
      - name: Package
        run: packaging/dist.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  publish:
    name: Publish release
    needs: [linux-windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            --title "First Aid Cat ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
