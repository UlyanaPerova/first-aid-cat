name: Release

# A tag like v0.9.1 builds all three systems and publishes a GitHub release with installers, portable archives and checksums.
on:
  push:
    tags: ["v*"]
  # trial run from the Actions tab: builds every installer as artifacts, publishes nothing
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-windows:
    name: Linux and Windows builds
    # the oldest supported Ubuntu: the binary then needs only glibc 2.35
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends gcc-mingw-w64-x86-64 rpm squashfs-tools
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Cargo.toml version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Test
        working-directory: engine
        run: cargo test --release --locked
      - name: Build
        working-directory: engine
        run: |
          cargo build --release --locked
          cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Package
        run: |
          packaging/dist.sh linux
          packaging/dist.sh windows
          packaging/dist.sh deb
          packaging/dist.sh rpm
          packaging/dist.sh appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
      # the Windows job wraps this very binary into the setup .exe, so every asset comes from one build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: engine/target/x86_64-pc-windows-gnu/release/aptechka.exe

  windows-setup:
    name: Windows setup (Inno Setup)
    needs: linux-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: win-exe
      - name: Inno Setup
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress
          fi
          test -f "$ISCC" || { echo "ISCC.exe not found"; exit 1; }
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          mkdir -p dist
          # MSYS_NO_PATHCONV: keep the /D switches from being rewritten as paths
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=$v" "/DSourceExe=$(cygpath -w "$PWD/win-exe/aptechka.exe")" packaging/windows/first-aid-cat.iss
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*-setup.exe

  macos:
    name: macOS build (Apple silicon)
    runs-on: macos-15   # Xcode 16 / macOS 15 SDK: the widget uses macOS 15 APIs behind availability checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Test
        working-directory: engine
        run: cargo test --release --locked
      - name: Build app
        run: macos/build_app.sh
      - name: Package
        run: |
          packaging/dist.sh macos
          packaging/dist.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-windows, windows-setup, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          rm -f aptechka.exe   # the input of the setup build, not a release file
          chmod +x *.AppImage  # artifacts lose the executable bit
          sha256sum *.tar.gz *.zip *.deb *.rpm *.AppImage *-setup.exe *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.AppImage dist/*-setup.exe dist/*.dmg dist/SHA256SUMS.txt \
            --title "First Aid Cat ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
