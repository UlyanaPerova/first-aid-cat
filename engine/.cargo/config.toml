# Сборка для любого процессора этой архитектуры (x86-64-v2: SSE4.2/POPCNT — есть у всех x86-64 начиная
# примерно с 2009 г.). Раньше было target-cpu=native: такой файл на более старом процессоре падал с «illegal
# instruction». Для своей машины можно собрать быстрее: RUSTFLAGS="-C target-cpu=native" cargo build --release
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
